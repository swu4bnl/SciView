[workspace]
authors = ["swu4bnl <swu4@bnl.gov>"]
channels = ["conda-forge"]
name = "SciView"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
launch-app = { cmd = "python -m sciview.launchers app", env = { PYTHONPATH = "src" } }

[dependencies]
python = "3.12.*"
pytest = ">=9.0.3,<10"
pyyaml = ">=6.0.3,<7"
pillow = ">=12.2.0,<13"
numpy = ">=2.4.3,<3"
pyqt = ">=5.15.11,<6"
matplotlib = ">=3.10.9,<4"
scipy = ">=1.17.1,<2"
pyqtgraph = ">=0.13,<0.14"
qdarkstyle = ">=3.2.3,<4"
qt-material = ">=2.14,<3"
scitoolsscianalysis = ">=2.6.6,<3"
psutil = ">=7.1.0,<8"
tiled = ">=0.1"
ipython = ">=9.13.0,<10"
ipdb = ">=0.13.13,<0.14"
debugpy = ">=1.8.20,<2"
bluesky-tiled-plugins = ">=0.2.0"

[pypi-dependencies]
pyqtdarktheme = ">=2.1,<3"

# Optional SMI environment; the backend installs directly from a pinned GitHub revision.
[feature.smi.dependencies]
pandas = ">=2,<3"
xarray = "*"
h5py = "*"
scikit-image = ">=0.26,<0.27"
dask = "*"
zarr = "*"

[feature.smi.pypi-dependencies]
smi-tiled = { git = "https://github.com/EliotGann/smi-tiled.git", rev = "a82c0e664de9f3c8f9083ca1b7d98cf0b86e6dbc", extras = ["tiled"] }

[environments]
default = { features = [], solve-group = "default" }
smi = { features = ["smi"], solve-group = "default" }

[feature.smi.tasks]
launch-smi = { cmd = "python -m sciview.launchers app", env = { PYTHONPATH = "src", PYTHONNOUSERSITE = "1", SCIVIEW_PROFILE = "smi_migration" } }
