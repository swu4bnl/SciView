[workspace]
authors = ["swu4bnl <swu4@bnl.gov>"]
channels = ["conda-forge"]
name = "SciView"
platforms = [
    "win-64",
    { name = "linux-glibc228", platform = "linux-64", glibc = "2.28" },
    { name = "macos-intel", platform = "osx-64", macos = "14.0" },
    { name = "macos-arm64", platform = "osx-arm64", macos = "14.0" },
]
version = "0.1.0"
requires-pixi = ">=0.75"

[tasks]
launch-app = { cmd = "python -m sciview.launchers app", env = { PYTHONPATH = "src" } }
test = { cmd = "python -m pytest", env = { PYTHONPATH = "src", QT_QPA_PLATFORM = "offscreen" } }
benchmark-ui = { cmd = "python -m sciview.dev.benchmark_ui", env = { PYTHONPATH = "src" } }
verify-installation = { cmd = "python scripts/verify_installation.py", env = { QT_QPA_PLATFORM = "offscreen" } }
test-installation = { cmd = "python scripts/test_installation.py", env = { QT_QPA_PLATFORM = "offscreen" } }

[dependencies]
python = "3.12.*"
pytest = ">=9.0.3,<10"
pyyaml = ">=6.0.3,<7"
pillow = ">=12.2.0,<13"
numpy = ">=2.4.3,<3"
matplotlib-base = ">=3.10.9,<4"
scipy = ">=1.17.1,<2"
pyqtgraph = ">=0.13,<0.14"
qdarkstyle = ">=3.2.3,<4"
qt-material = ">=2.14,<3"
scitoolsscianalysis = ">=2.6.6,<3"
psutil = ">=7.1.0,<8"
tiled = ">=0.2.19,<0.3"
ipython = ">=9.13.0,<10"
ipdb = ">=0.13.13,<0.14"
debugpy = ">=1.8.20,<2"
git = ">=2.40,<3"

[pypi-dependencies]
PyQt6 = ">=6.8,<6.9"
PyQt6-WebEngine = ">=6.8,<6.9"
PyQt6-Qt6 = ">=6.8,<6.9"
PyQt6-WebEngine-Qt6 = ">=6.8,<6.9"
pyqtdarktheme = ">=2.1,<3"
bluesky-tiled-plugins = ">=2.0.12,<3"

[feature.notebook-build.dependencies]
nodejs = ">=22,<23"

[environments]
notebook-build = ["notebook-build"]
