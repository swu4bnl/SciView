calibration.ring.result:
  text: "中心 ({x:.1f}, {y:.1f})，r={radius:.1f}px，拟合度={score:.0f}%"
  context: "Calculated ring center, radius, and fit score."
  placeholders:
    x: "Horizontal center coordinate in pixels."
    y: "Vertical center coordinate in pixels."
    radius: "Calculated ring radius in pixels."
    score: "Fit quality as a percentage."
calibration.ring.result_excluded:
  text: "中心 ({x:.1f}, {y:.1f})，r={radius:.1f}px，拟合度={score:.0f}%（已排除 {count} 个点）"
  context: "Calculated ring result when outlier points were excluded."
  placeholders:
    x: "Horizontal center coordinate in pixels."
    y: "Vertical center coordinate in pixels."
    radius: "Calculated ring radius in pixels."
    score: "Fit quality as a percentage."
    count: "Number of excluded ring points."
