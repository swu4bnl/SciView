image_browser.progress.reading_tile:
  text: "正在读取图块 {completed}/{total}…"
  context: "Progress text shown while downloading image tiles."
  placeholders:
    completed: "Number of tiles already read."
    total: "Total number of tiles to read."
image_browser.progress.reading_image:
  text: "正在读取图像数据…"
  context: "Progress text shown while reading image data."
image_browser.progress.matching_files:
  text: "找到 {count} 个匹配文件"
  context: "Progress message reporting files matching a folder search."
  placeholders:
    count: "Number of matching files."
image_browser.progress.added_file:
  text: "已添加 {current}/{total}：{filename}"
  context: "Progress message reporting a folder image reference being added."
  placeholders:
    current: "Position of the current file in the folder results."
    total: "Number of files in the folder results."
    filename: "Name of the file being added."
image_browser.error.unknown_import:
  text: "未知导入错误"
  context: "Fallback detail shown when the Tiled client import error is unavailable."
image_browser.error.tiled_unavailable:
  text: "Tiled 客户端不可用：{error}"
  context: "Error shown when a Tiled image cannot be loaded because its client is unavailable."
  placeholders:
    error: "Details returned for the Tiled client import failure."
image_browser.progress.cancelled_range:
  text: "已取消：已加载 {loaded} 个，跳过 {skipped}/{processed} 个扫描"
  context: "Progress summary shown when a range load is cancelled."
  placeholders:
    loaded: "Number of scans loaded before cancellation."
    skipped: "Number of scans skipped before cancellation."
    processed: "Number of scans processed before cancellation."
image_browser.progress.scan_range:
  text: "扫描 {scan_id}：已加载 {loaded} 个，已跳过 {skipped}/{processed} 个"
  context: "Progress update while loading scans from a range."
  placeholders:
    scan_id: "Identifier of the scan currently being processed."
    loaded: "Number of scans loaded so far."
    skipped: "Number of scans skipped so far."
    processed: "Number of scans processed so far."
image_browser.progress.complete_range:
  text: "完成：已加载 {loaded} 个，跳过 {skipped}/{total} 个扫描"
  context: "Summary shown when a range load finishes."
  placeholders:
    loaded: "Number of scans loaded."
    skipped: "Number of scans skipped."
    total: "Number of scans in the requested range."
image_browser.progress.connecting_tiled:
  text: "正在连接 Tiled 服务器：{profile}"
  context: "Progress message shown while connecting to a Tiled profile."
  placeholders:
    profile: "Name of the selected Tiled profile."
image_browser.error.scan_not_found:
  text: "目录中未找到扫描 {scan_id}"
  context: "Error shown when the requested scan is absent from the Tiled catalog."
  placeholders:
    scan_id: "Identifier of the requested scan."
image_browser.progress.processing_image:
  text: "正在处理图像数据..."
  context: "Progress message shown while preparing loaded image data for display."
image_browser.progress.tiled_complete:
  text: "Tiled 加载完成 - 扫描 {scan_id}"
  context: "Progress message shown after a Tiled scan finishes loading."
  placeholders:
    scan_id: "Identifier of the loaded scan."
image_browser.error.tiled_loading:
  text: "Tiled 加载错误：{error}"
  context: "Error shown when loading image data from Tiled fails."
  placeholders:
    error: "Exception detail from the Tiled image-loading operation."
image_browser.progress.loading_file:
  text: "正在加载 {filename}"
  context: "Progress message shown while loading an image file."
  placeholders:
    filename: "Name of the image file being loaded."
image_browser.progress.file_complete:
  text: "文件加载完成"
  context: "Progress message shown when an image file finishes loading."
image_browser.error.file_load_failed:
  text: "无法从 {path} 加载图像"
  context: "Error shown when a file loader returns no image data."
  placeholders:
    path: "Path of the image file that could not be loaded."
image_browser.error.loading_file:
  text: "加载文件时出错：{error}"
  context: "Error shown when an exception occurs while loading an image file."
  placeholders:
    error: "Exception detail from the image file-loading operation."
