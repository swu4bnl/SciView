name: Installation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out SciView
        uses: actions/checkout@v4

      - name: Install through Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command pixi -ErrorAction SilentlyContinue) {
              throw "The runner already has Pixi on PATH. The installer test requires a runner without Pixi."
          }
          $env:SCIVIEW_FORCE_CMD_LAUNCHER = "1"
          & cmd.exe /d /c Launch-SciView-win64.cmd -SetupOnly -NoAutoPull -AcceptPixiInstall
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Remove-Item Env:SCIVIEW_FORCE_CMD_LAUNCHER
          & cmd.exe /d /c Launch-SciView-win64.cmd -SetupOnly -NoAutoPull -AcceptPixiInstall
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $pixi = @(
              "$env:LOCALAPPDATA\pixi\bin\pixi.exe"
              "$env:USERPROFILE\.pixi\bin\pixi.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $pixi) {
              throw "The launcher completed, but the test could not find Pixi."
          }
          & $pixi run verify-installation
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          & $pixi run test
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          & .\scripts\install_sciview_launcher_windows.ps1 -Add
          $shell = New-Object -ComObject Shell.Application
          foreach ($shortcutPath in @(
              (Join-Path ([Environment]::GetFolderPath("Desktop")) "SciView.lnk"),
              (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\SciView.lnk")
          )) {
              $item = $shell.Namespace((Split-Path -Parent $shortcutPath)).ParseName((Split-Path -Leaf $shortcutPath))
              if ($item.ExtendedProperty("System.AppUserModel.ID") -ne "io.github.swu4bnl.sciview") {
                  throw "Shortcut AppUserModelID was not set: $shortcutPath"
              }
          }
          & .\scripts\install_sciview_launcher_windows.ps1 -Remove

      - name: Install through Unix launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v pixi >/dev/null 2>&1; then
              echo "The runner already has Pixi on PATH. The installer test requires a runner without Pixi."
              exit 1
          fi
          ./scripts/run_sciview_unix.sh --setup-only --no-auto-pull
          "$HOME/.pixi/bin/pixi" run verify-installation
          "$HOME/.pixi/bin/pixi" run test
            ./scripts/install_sciview_launcher_unix.sh --add
            if [[ "$(uname -s)" == "Darwin" ]]; then
              test -f "$HOME/Applications/SciView.app/Contents/Resources/sciview.icns"
            else
              test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/SciView.desktop"
            fi
            ./scripts/install_sciview_launcher_unix.sh --remove

  rhel-installation:
    name: rhel-ubi8.10
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi8/ubi:8.10

    steps:
      - name: Install launcher prerequisites
        run: dnf install -y curl findutils gzip tar && dnf clean all

      - name: Check out SciView
        uses: actions/checkout@v4

      - name: Install through Unix launcher
        env:
          HOME: /tmp/sciview-home
        run: |
          mkdir -p "$HOME"
          if command -v pixi >/dev/null 2>&1; then
              echo "The container already has Pixi on PATH. The installer test requires a container without Pixi."
              exit 1
          fi
          ./scripts/run_sciview_unix.sh --setup-only --no-auto-pull
          "$HOME/.pixi/bin/pixi" run verify-installation
          "$HOME/.pixi/bin/pixi" run test
          ./scripts/install_sciview_launcher_unix.sh --add
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/SciView.desktop"
          ./scripts/install_sciview_launcher_unix.sh --remove